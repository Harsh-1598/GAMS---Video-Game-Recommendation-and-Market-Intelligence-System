[project]
name = "gams"
version = "1.0.0"
description = "GAMS machine-learning game recommendation system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
]

[tool.vercel]
entrypoint = "backend.main:app"
